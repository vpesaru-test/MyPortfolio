# ─────────────────────────────────────────────────────────────
# Certifications & learning — shown in this order.
#
# "kind" sets the colour of the dot on each card:
#   ai           → teal   (AI / LLM certifications)
#   aws          → amber  (AWS certifications)
#   course       → grey   (short courses)
#   professional → orange (professional testing credentials)
# "date" can be a month/year or a word such as "Professional".
# To make a card clickable (opens in a new tab), add ONE of:
#   url:  link to the online credential, e.g. a Credly badge or a
#         course-completion page
#   file: name of a certificate PDF/image you put in assets/certificates/,
#         e.g.  file: aws-ai-practitioner.pdf
# ─────────────────────────────────────────────────────────────

