<section id="education">
  {%- assign heading = "Education" -%}{%- assign heading_em = "& Background" %}
{% include section-header.html %}
  <div class="edu-grid">
    {%- for e in site.data.education %}
    <div class="edu-card">
      <div class="edu-degree">{{ e.degree | escape }}</div>
      <div class="edu-school">{{ e.school | escape }}</div>
      <div class="edu-detail">{{ e.location | escape }} · {{ e.period }}</div>
    </div>
    {%- endfor %}
  </div>
</section>
